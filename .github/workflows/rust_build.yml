name: Rust core

# Builds and smoke-tests the Rust implementation of pyodbc
# (see docs/rust-asyncio-rewrite-plan.md).  As the port progresses, the pytest
# suites move from the "Ubuntu build" workflow (C++ reference) into this one.

# include "workflow_dispatch" so this workflow can be run manually from the Actions portal
on: [push, pull_request, workflow_dispatch]

jobs:
  build_and_test:
    name: Build and smoke-test the Rust core
    # 22.04 rather than 24.04: the pinned MySQL Connector/ODBC 8.0.22 build (the
    # same one the C++ reference workflow installs) fails to dlopen on 24.04
    # because its shared-library dependencies are no longer present there.
    runs-on: ubuntu-22.04

    services:
      mssql2019:
        image: mcr.microsoft.com/mssql/server:2019-latest
        ports:
        - 1402:1433
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: StrongPassword2019

      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: postgres_db
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_pwd
        ports:
        - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
        - 3306:3306
        options: --health-cmd "mysqladmin ping -proot" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4.3.0

    - name: Set up Python
      uses: actions/setup-python@v5.0.0
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install unixODBC and the SQLite ODBC driver
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev libsqliteodbc

    - name: Install the ODBC driver for SQL Server
      run: |
        sudo ACCEPT_EULA=Y apt-get install --yes msodbcsql18

    - name: Install the ODBC driver for PostgreSQL
      run: |
        sudo apt-get install --yes odbc-postgresql
        sudo sed -i 's|Driver=psqlodbca.so|Driver=/usr/lib/x86_64-linux-gnu/odbc/psqlodbca.so|g' /etc/odbcinst.ini
        sudo sed -i 's|Driver=psqlodbcw.so|Driver=/usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so|g' /etc/odbcinst.ini
        sudo sed -i 's|Setup=libodbcpsqlS.so|Setup=/usr/lib/x86_64-linux-gnu/odbc/libodbcpsqlS.so|g' /etc/odbcinst.ini

    - name: Install the ODBC driver for MySQL
      env:
        MYSQL_DRIVER: mysql-connector-odbc-8.0.22-linux-glibc2.12-x86-64bit
      run: |
        cd "$RUNNER_TEMP"
        curl --silent --show-error -O "https://www.mirrorservice.org/sites/ftp.mysql.com/Downloads/Connector-ODBC/8.0/${MYSQL_DRIVER}.tar.gz"
        tar -xz -f "${MYSQL_DRIVER}.tar.gz"
        sudo cp -v "${MYSQL_DRIVER}/lib/libmyodbc8a.so" /usr/lib/x86_64-linux-gnu/odbc/
        sudo chmod a+r /usr/lib/x86_64-linux-gnu/odbc/libmyodbc8a.so
        echo '[MySQL ODBC 8.0 ANSI Driver]' > mysql_odbcinst.ini
        echo 'Driver     = /usr/lib/x86_64-linux-gnu/odbc/libmyodbc8a.so' >> mysql_odbcinst.ini
        echo 'UsageCount = 1' >> mysql_odbcinst.ini
        echo 'Threading  = 2' >> mysql_odbcinst.ini
        sudo odbcinst -i -d -f mysql_odbcinst.ini

    - name: Create the test database in SQL Server
      run: |
        docker exec -i "${{ job.services.mssql2019.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'StrongPassword2019' -C -Q "SELECT @@VERSION" || sleep 5
        docker exec -i "${{ job.services.mssql2019.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'StrongPassword2019' -C -Q "CREATE DATABASE test"

    - name: Create the test database in PostgreSQL
      env:
        PGHOST: localhost
        PGPORT: "5432"
        PGDATABASE: postgres_db
        PGUSER: postgres_user
        PGPASSWORD: postgres_pwd
      run: |
        psql -c "CREATE DATABASE test WITH encoding='UTF8' LC_COLLATE='en_US.utf8' LC_CTYPE='en_US.utf8'"

    - name: Create the test database in MySQL
      run: |
        mysql --host=127.0.0.1 --user=root --password=root --execute "CREATE DATABASE test"

    - name: Lint
      run: |
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip maturin
        maturin build --release --out dist
        python -m pip install dist/*.whl

    - name: Smoke test
      run: |
        cd /tmp   # keep the repo's python/ source tree off the import path
        python - <<'EOF'
        import pyodbc

        print('version:', pyodbc.version)
        assert pyodbc.apilevel == '2.0'
        assert pyodbc.paramstyle == 'qmark'

        # constants come from the generated table
        assert pyodbc.SQL_VARCHAR == 12
        assert pyodbc.SQL_WMETADATA == -888
        assert pyodbc.SQLWCHAR_SIZE == 2

        # DB API exception hierarchy
        assert issubclass(pyodbc.OperationalError, pyodbc.DatabaseError)
        assert issubclass(pyodbc.DatabaseError, pyodbc.Error)
        assert not issubclass(pyodbc.Warning, pyodbc.Error)

        drivers = pyodbc.drivers()
        print('drivers:', drivers)
        assert isinstance(drivers, list)
        assert any('SQLite' in d for d in drivers)

        sources = pyodbc.dataSources()
        print('dataSources:', sources)
        assert isinstance(sources, dict)
        try:
            pyodbc.dataSources(scope='bogus')
        except ValueError:
            pass
        else:
            raise AssertionError('expected ValueError for bad scope')

        print('smoke test passed')
        EOF

    - name: Async SQLite round-trip
      run: |
        cd /tmp
        python - <<'EOF'
        import asyncio, tempfile
        import pyodbc

        async def main():
            tmpdir = tempfile.mkdtemp()
            async with pyodbc.connect(f'driver=SQLite3;database={tmpdir}/ci.db') as cnxn:
                cursor = cnxn.cursor()
                await cursor.execute('create table t1(n int, s varchar(20))')
                await cursor.executemany(
                    'insert into t1 values (?, ?)', [(i, f'row{i}') for i in range(5)])
                rows = await (await cursor.execute('select n, s from t1 order by n')).fetchall()
                assert [r.n for r in rows] == list(range(5))
                assert rows[3].s == 'row3'
                assert cursor.description[0][0] == 'n'
                total = 0
                async for row in await cursor.execute('select n from t1'):
                    total += row[0]
                assert total == 10
                try:
                    await cursor.execute('select * from nonexistent_table')
                except pyodbc.Error as e:
                    assert isinstance(e.args[0], str)
                else:
                    raise AssertionError('expected pyodbc.Error')
            assert not cnxn.closed  # __aexit__ commits, does not close
            await cnxn.close()
            print('async round-trip passed')

        asyncio.run(main())
        EOF

    - name: Run the SQLite test suite
      run: |
        pip install -r requirements-dev.txt
        python -m pytest tests/sqlite_test.py --no-header -q

    - name: Run the SQL Server test suite
      env:
        PYODBC_SQLSERVER: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1402;UID=sa;PWD=StrongPassword2019;DATABASE=test;Encrypt=Optional"
      run: |
        python -m pytest tests/sqlserver_test.py --no-header -q

    - name: Run the PostgreSQL test suite
      env:
        PYODBC_POSTGRESQL: "DRIVER={PostgreSQL Unicode};SERVER=localhost;PORT=5432;UID=postgres_user;PWD=postgres_pwd;DATABASE=test"
      run: |
        python -m pytest tests/postgresql_test.py --no-header -q

    - name: Run the MySQL test suite
      env:
        PYODBC_MYSQL: "DRIVER={MySQL ODBC 8.0 ANSI Driver};SERVER=localhost;UID=root;PWD=root;DATABASE=test;CHARSET=utf8mb4"
      run: |
        python -m pytest tests/mysql_test.py --no-header -q

    - name: Check generated constants are up to date
      run: |
        python utils/generate-odbc-constants.py
        git diff --exit-code rust/constants.rs
