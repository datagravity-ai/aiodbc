# Build all the artifacts for a release (i.e. the source distribution file and the various wheels)
# https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job
# https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
# https://cibuildwheel.readthedocs.io/en/stable/options/#options-summary
#
# The build backend is maturin (see pyproject.toml), which produces one abi3
# (cp310-abi3) wheel per platform/architecture that serves every supported Python
# version.  cibuildwheel still drives the builds: it provides the manylinux and
# musllinux containers, QEMU emulation for aarch64, and auditwheel repair.  Each
# job builds only the cp310 variant, since that abi3 wheel covers 3.10+.

name: Build the release artifacts

# include "workflow_dispatch" so this workflow can be run manually from the Actions portal
on: [workflow_dispatch]

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Smoke-test the sdist
        # An sdist must build from source with only a Rust toolchain and the
        # unixODBC headers (docs/rust-asyncio-rewrite-plan.md, phase 6).
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          python -m pip install dist/*.gz
          cd /tmp && python -c "import aiodbc; print('sdist build OK:', aiodbc.version)"

      - name: Upload sdist
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sdist__${{ github.sha }}
          path: ./dist/*.gz

  build_windows_x86_wheels:
    name: Build wheels on Windows x86_64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # the win32 wheel cross-compiles from the x86_64 host
          targets: i686-pc-windows-msvc

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS_WINDOWS: "AMD64 x86"
          # one abi3 wheel per architecture
          CIBW_BUILD: "cp310-win_amd64 cp310-win32"

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_windows_x86_64__${{ github.sha }}
          path: ./wheelhouse/*.whl

  build_windows_arm64_wheels:
    name: Build wheels on Windows ARM64
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BUILD: "cp310-win_arm64"

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_windows_arm64__${{ github.sha }}
          path: ./wheelhouse/*.whl

  build_ubuntu_manylinux_wheels:
    name: Build wheels on Ubuntu manylinux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Set up QEMU
        # QEMU is needed for Linux aarch64 wheels (the aarch64 build, Rust
        # compilation included, runs emulated - slow, but this workflow is
        # manual-only)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          # https://github.com/pypa/manylinux#docker-images
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS_LINUX: x86_64 aarch64
          # the containers need the unixODBC headers to link against and a Rust
          # toolchain for maturin
          CIBW_BEFORE_ALL_LINUX: >
            yum -y install unixODBC-devel &&
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # one abi3 wheel per architecture
          CIBW_BUILD: "cp310-manylinux_x86_64 cp310-manylinux_aarch64"
          # the raw wheel filename is not PyPi compliant so the wheel must be repaired but
          # suppress the addition of unixODBC libs to the wheel with --exclude's
          CIBW_REPAIR_WHEEL_COMMAND_LINUX:
            auditwheel repair
              --exclude "libodbc.so.*"
              --wheel-dir {dest_dir}
              {wheel}

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_ubuntu_manylinux__${{ github.sha }}
          path: ./wheelhouse/*.whl

  build_ubuntu_musllinux_wheels:
    name: Build wheels on Ubuntu musllinux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Set up QEMU
        # QEMU is needed for Linux aarch64 wheels
        uses: docker/setup-qemu-action@v3.6.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          # https://github.com/pypa/manylinux#docker-images
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_ARCHS_LINUX: x86_64 aarch64
          # the containers need the unixODBC headers, a C toolchain and curl for
          # rustup, and a Rust toolchain for maturin
          CIBW_BEFORE_ALL_LINUX: >
            apk add unixodbc-dev curl gcc musl-dev &&
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # one abi3 wheel per architecture
          CIBW_BUILD: "cp310-musllinux_x86_64 cp310-musllinux_aarch64"
          # the raw wheel filename is not PyPi compliant so the wheel must be repaired but
          # suppress the addition of unixODBC libs to the wheel with --exclude's
          CIBW_REPAIR_WHEEL_COMMAND_LINUX:
            auditwheel repair
              --exclude "libodbc.so.*"
              --wheel-dir {dest_dir}
              {wheel}

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_ubuntu_musllinux__${{ github.sha }}
          path: ./wheelhouse/*.whl

  build_macos_x86_wheels:
    name: Build wheels on macOS x86_64
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        # https://cibuildwheel.readthedocs.io/en/stable/options/#options-summary
        env:
          CIBW_ARCHS_MACOS: x86_64
          CIBW_BUILD: "cp310*macosx_x86_64"
          # suppress the inclusion of the unixODBC dynamic libraries by disabling the repair command
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_macos_x86__${{ github.sha }}
          path: ./wheelhouse/*.whl

  build_macos_arm64_wheels:
    name: Build wheels on macOS ARM64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4.3.0

      - name: Install unixODBC
        # unixODBC is necessary for the SQL C header files, e.g. sql.h, but doesn't appear
        # to be pre-installed on macos-14, hence make sure it really is installed
        run: brew install unixodbc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        # https://cibuildwheel.readthedocs.io/en/stable/options/#options-summary
        env:
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD: "cp310*macosx_arm64"
          # suppress the inclusion of the unixODBC dynamic libraries by disabling the repair command
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels_macos_arm64__${{ github.sha }}
          path: ./wheelhouse/*.whl
