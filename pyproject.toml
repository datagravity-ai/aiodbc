[project]
name = "pyodbc"
version = "5.4.0"

requires-python = ">=3.10"
# This is used by the GitHub action that builds release artifacts using cibuildwheel.
# cibuildwheel reads this directly:
#
# https://cibuildwheel.readthedocs.io/en/stable/options/#requires-python

description = "DB API module for ODBC"
readme = "README.md"
license = "MIT-0"

authors = [{name = "Michael Kleehammer", email="michael@kleehammer.com"}]

maintainers = [{name = "Michael Kleehammer", email="michael@kleehammer.com"}]
# There are a lot of contributors and I'd like to include everyone that puts in a lot of
# effort, but is this for the more technical meaning of who makes builds?  Would adding
# contributors cause confusion.

classifiers=['Development Status :: 5 - Production/Stable',
             'Intended Audience :: Developers',
             'Intended Audience :: System Administrators',
             'Operating System :: Microsoft :: Windows',
             'Operating System :: POSIX',
             'Programming Language :: Python',
             'Programming Language :: Python :: 3',
             'Topic :: Database',
             ]

[project.urls]
Homepage = "https://github.com/mkleehammer/pyodbc"

[tool.pytest.ini_options]
# The test suites are async (see docs/rust-asyncio-rewrite-plan.md); auto mode lets
# plain "async def" tests and fixtures run without per-test markers.
asyncio_mode = "auto"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# The Rust core (rust/ + Cargo.toml) is the module being built; the C++ sources in
# src/ remain in the tree for reference during the rewrite and can still be built
# directly with "python setup.py build_ext --inplace".
[tool.maturin]
python-source = "python"
module-name = "pyodbc._core"
